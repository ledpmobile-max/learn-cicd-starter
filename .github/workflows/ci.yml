name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.10"

      - name: Run Tests
        run: go test ./... -cover

  estilo:
    name: Estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Check out code
      
      - uses: actions/setup-go@v5
        name: Set up Go
        with:
          go-version: '1.24.10'

      - name: Check Format
        run: test -z $(go fmt ./...)