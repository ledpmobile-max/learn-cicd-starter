name: ci

on:
  pull_request:
    branches: [main]

jobs: # <-- Clave principal de trabajos (¡No duplicar ni anidar!)
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1" # Mantén la versión que usaste originalmente

      - name: Run Tests
        run: go test ./... -cover

  estilo: # <-- El nuevo trabajo, al mismo nivel que 'tests'
    name: Estilo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Check out code
      
      - uses: actions/setup-go@v5
        name: Set up Go
        with:
          go-version: '1.25.1' # Mantén la misma versión

      - name: Check Format
        run: test -z $(go fmt ./...)