name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Run Tests
        run: go test ./... -cover

  style:  
    name: Style
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"
      - name: Install Staticcheck 
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run Staticcheck
        run: staticcheck ./...
      - name: Check Format
        run: test -z $(go fmt ./...)
  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.5"      
      - name: Install Gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@lates        
      - name: Run Gosec # Ejecuta el análisis de seguridad
        run: gosec ./...